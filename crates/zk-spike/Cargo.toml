[package]
name = "zk-spike"
version = "0.1.0"
edition = "2021"
rust-version = "1.87"
license = "MIT OR Apache-2.0"
publish = false

# Crate JETABLE — spike de faisabilité E2 (phase 3z-b, witness-hiding).
# Ne fait PAS partie du protocole ; sert uniquement à mesurer la fuite de témoin
# de winterfell 0.13.1 et à tester la technique des « lignes de blindage ».
#
# Vit HORS du workspace (cf. `exclude` à la racine), comme `fuzz` : il ne doit pas
# peser sur le build ni les tests de consensus. Ses dépendances sont donc figées
# ici en clair plutôt qu'héritées du workspace.

[dependencies]
winterfell = "0.13"
winter-crypto = "0.13"
winter-math = "0.13"
winter-air = "0.13"
rand = "0.8"
