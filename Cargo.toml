[workspace]
resolver = "2"
members = ["crates/crypto", "crates/ledger", "crates/proved-hash", "crates/circuit", "crates/net", "crates/node", "crates/wallet"]
# Vivent HORS du workspace, pour ne pas peser sur le build de consensus (build et
# test par défaut) :
#   - `fuzz`     : exige nightly (cargo-fuzz) ; cf. fuzz/Cargo.toml.
#   - `zk-spike` : crate JETABLE (spike de faisabilité), ne fait PAS partie du
#                  protocole ; cf. crates/zk-spike/Cargo.toml.
exclude = ["fuzz", "crates/zk-spike"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.87"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
blake3 = "1.5"
sha3 = "0.10"
x25519-dalek = { version = "2.0", features = ["static_secrets"] }
ed25519-dalek = "2.1"
pqcrypto-mlkem = "=0.1.1"
pqcrypto-mldsa = "=0.1.2"
pqcrypto-traits = "0.3"
aes-gcm = "0.10"
chacha20poly1305 = "0.10"
rand_core = { version = "0.6", features = ["getrandom"] }
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"
hex = "0.4"
thiserror = "1.0"
zeroize = "1.7"
argon2 = "0.5"
proptest = "1"
winter-crypto = "0.13"
winter-math = "0.13"
winterfell = "0.13"

[profile.release]
lto = "thin"
